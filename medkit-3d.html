<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Kit 3D</title>
<style>
  :root{
    --bg:#d9d5ce; --ink:#1d1d1f; --muted:#55555a; --panel:rgba(255,255,255,.74);
    --line:rgba(0,0,0,.08); --btn:rgba(255,255,255,.9); --accent:#b3141b; --accent-ink:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f2f2f4; --muted:#b0b0b6; --panel:rgba(26,26,28,.74); --line:rgba(255,255,255,.1); --btn:rgba(50,50,54,.9);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2f2f4; --muted:#b0b0b6; --panel:rgba(26,26,28,.74); --line:rgba(255,255,255,.1); --btn:rgba(50,50,54,.9);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .ui{position:fixed;left:16px;right:16px;top:16px;pointer-events:none;display:flex;justify-content:flex-start}
  .card{pointer-events:auto;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:440px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  h1{font-size:15px;margin:0 0 8px;letter-spacing:.2px}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--btn);color:var(--ink);
    padding:7px 11px;border-radius:999px;cursor:pointer}
  button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  #info{font-size:12.5px;line-height:1.45;color:var(--muted);margin:9px 0 0}
  .hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#5a5650;pointer-events:none}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:#55514b;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="load">Building models…</div>
<div class="ui">
  <div class="card">
    <h1>Medical kit — 3D models</h1>
    <div class="btns" id="btns">
      <button data-v="all" class="on">All</button>
      <button data-v="bag">White medkit bag</button>
      <button data-v="band">Bandages</button>
      <button data-v="pack">Large medkit backpack</button>
      <button id="spin">Auto-rotate</button>
    </div>
    <p id="info"></p>
  </div>
</div>
<div class="hint">Drag to orbit · scroll / pinch to zoom · right-drag to pan</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ------------------------------------------------------------------ renderer / scene */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const BG = 0xd9d5ce;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 24, 48);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, 7.5, 15);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 1.3, 0);
controls.minDistance = 1.2;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8178, 0.35));
const key = new THREE.DirectionalLight(0xfff3e4, 3.0);
key.position.set(-7, 13, 9);
key.castShadow = true;
const SM = innerWidth < 800 ? 2048 : 4096;
key.shadow.mapSize.set(SM, SM);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.015;
key.shadow.radius = 5;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdde7ff, 0.9);
rim.position.set(9, 7, -11);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(6, 3, 10);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240),
  new THREE.MeshStandardMaterial({ color: 0xbdb7ad, roughness: .94, envMapIntensity: .5 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ------------------------------------------------------------------ math helpers */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function noise3(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  const fx = x - X, fy = y - Y, fz = z - Z;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  return L(
    L(L(hash3(X, Y, Z), hash3(X + 1, Y, Z), u), L(hash3(X, Y + 1, Z), hash3(X + 1, Y + 1, Z), u), v),
    L(L(hash3(X, Y, Z + 1), hash3(X + 1, Y, Z + 1), u), L(hash3(X, Y + 1, Z + 1), hash3(X + 1, Y + 1, Z + 1), u), v), w);
}
const fbm = (x, y, z) => noise3(x, y, z) * .55 + noise3(x * 2.07 + 5.2, y * 2.07, z * 2.07) * .3 + noise3(x * 4.3, y * 4.3 + 1.7, z * 4.3) * .15;

function basisMatrix(p, x, y) {
  const X = x.clone().normalize();
  const Z = new THREE.Vector3().crossVectors(X, y).normalize();
  const Y = new THREE.Vector3().crossVectors(Z, X);
  return new THREE.Matrix4().makeBasis(X, Y, Z).setPosition(p);
}
function place(obj, p, x, y) { basisMatrix(p, x, y).decompose(obj.position, obj.quaternion, obj.scale); return obj; }
function mesh(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }

/* ------------------------------------------------------------------ procedural textures */
function mkCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, { repeat = [1, 1], color = true, clampEdge = false } = {}) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = clampEdge ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = ANISO;
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function addNoise(g, w, h, amt) {
  const d = g.getImageData(0, 0, w, h);
  for (let i = 0; i < d.data.length; i += 4) {
    const n = (Math.random() - .5) * amt;
    d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
  }
  g.putImageData(d, 0, 0);
}
function lighten(src, a) {
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.globalAlpha = a; g.drawImage(src, 0, 0);
  return c;
}
// basket-weave nylon (cordura / ripstop)
function weaveCanvas(size, n, ripstop) {
  const c = mkCanvas(size), g = c.getContext('2d'), cs = size / n;
  g.fillStyle = '#6e6e6e'; g.fillRect(0, 0, size, size);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = i * cs, y = j * cs, hor = (i + j) % 2 === 0;
    for (let k = 0; k < 2; k++) {
      const o = k * cs / 2, t = cs / 2;
      const gr = hor ? g.createLinearGradient(0, y + o, 0, y + o + t) : g.createLinearGradient(x + o, 0, x + o + t, 0);
      gr.addColorStop(0, '#4e4e4e'); gr.addColorStop(.5, '#dedede'); gr.addColorStop(1, '#4e4e4e');
      g.fillStyle = gr;
      hor ? g.fillRect(x + .7, y + o, cs - 1.4, t) : g.fillRect(x + o, y + .7, t, cs - 1.4);
    }
  }
  if (ripstop) {
    const s = size / ripstop;
    g.fillStyle = 'rgba(255,255,255,.6)';
    for (let k = 0; k < ripstop; k++) { g.fillRect(k * s, 0, 3, size); g.fillRect(0, k * s, size, 3); }
  }
  addNoise(g, size, size, 34);
  return c;
}
// woven webbing: ribs along the length + twill
function webbingCanvas() {
  const s = 128, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
  const n = 16;
  for (let i = 0; i < n; i++) {
    const x = i * s / n, gr = g.createLinearGradient(x, 0, x + s / n, 0);
    gr.addColorStop(0, '#3c3c3c'); gr.addColorStop(.5, '#d6d6d6'); gr.addColorStop(1, '#3c3c3c');
    g.fillStyle = gr; g.fillRect(x, 0, s / n, s);
  }
  g.globalAlpha = .22; g.strokeStyle = '#000'; g.lineWidth = 2;
  for (let k = -s; k < 2 * s; k += 8) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + s, s); g.stroke(); }
  g.globalAlpha = 1;
  // darker selvedge on both edges
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, 5, s); g.fillRect(s - 5, 0, 5, s);
  addNoise(g, s, s, 24);
  return c;
}
// 3D spacer "airmesh"
function airmeshCanvas() {
  const s = 256, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, s, s);
  const r = 9, dx = 2 * r * 1.15, dy = r * 1.75;
  for (let row = -1; row * dy < s + dy; row++) for (let col = -1; col * dx < s + dx; col++) {
    const x = col * dx + (row % 2 ? dx / 2 : 0), y = row * dy;
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, '#000'); gr.addColorStop(.75, '#1a1a1a'); gr.addColorStop(1, '#9a9a9a');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * .8, 0, 0, Math.PI * 2); g.fill();
  }
  addNoise(g, s, s, 20);
  return c;
}
// braided paracord
function braidCanvas(base, tracer) {
  const s = 64, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 8; i++) {
    const x = i * 8;
    g.fillStyle = i % 4 === 0 ? tracer : 'rgba(0,0,0,.28)';
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 4, 0); g.lineTo(x + 4 + 16, 32); g.lineTo(x + 16, 32); g.fill();
    g.beginPath(); g.moveTo(x + 16, 32); g.lineTo(x + 20, 32); g.lineTo(x + 4, 64); g.lineTo(x, 64); g.fill();
  }
  addNoise(g, s, s, 30);
  return c;
}
// cotton gauze: open leno weave (alpha)
function gauzeMaskCanvas() {
  const s = 128, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#fff'; g.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const p = i * 16 + 8;
    g.lineWidth = 4.5 + Math.random();
    g.beginPath(); for (let y = 0; y <= s; y += 4) g.lineTo(p + Math.sin(y * .35 + i) * 1.1, y); g.stroke();
    g.lineWidth = 4 + Math.random();
    g.beginPath(); for (let x = 0; x <= s; x += 4) g.lineTo(x, p + Math.sin(x * .3 + i * 2) * 1.1); g.stroke();
  }
  // stray fibres
  g.lineWidth = .8; g.globalAlpha = .7;
  for (let k = 0; k < 40; k++) { const x = Math.random() * s, y = Math.random() * s, a = Math.random() * 6.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); g.stroke(); }
  return c;
}
// elastic crepe: crinkled weft
function crepeCanvas() {
  const s = 256, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 4) {
    g.strokeStyle = y % 8 ? '#5a5a5a' : '#c8c8c8'; g.lineWidth = 2.2;
    g.beginPath();
    for (let x = 0; x <= s; x += 4) g.lineTo(x, y + Math.sin(x * .19 + y * .7) * 1.6 + Math.sin(x * .05 + y) * 1.2);
    g.stroke();
  }
  g.globalAlpha = .25; g.strokeStyle = '#fff'; g.lineWidth = 1;
  for (let x = 0; x < s; x += 6) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, s); g.stroke(); }
  g.globalAlpha = 1;
  addNoise(g, s, s, 26);
  return c;
}
function fineWeaveCanvas() {
  const s = 128, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#909090'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < s; i += 4) {
    g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(i, 0, 2, s);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, i + 1, s, 1.5);
  }
  addNoise(g, s, s, 30);
  return c;
}
function prismCanvas() {
  const s = 128, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 8) for (let x = 0; x < s; x += 8) {
    const o = (y / 8) % 2 ? 4 : 0;
    g.fillStyle = '#e8e8e8'; g.beginPath(); g.moveTo(x + o, y); g.lineTo(x + o + 4, y + 4); g.lineTo(x + o, y + 8); g.lineTo(x + o - 4, y + 4); g.fill();
  }
  addNoise(g, s, s, 18);
  return c;
}
function paperCanvas() {
  const s = 256, c = mkCanvas(s), g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
  g.lineWidth = .7;
  for (let k = 0; k < 500; k++) { const x = Math.random() * s, y = Math.random() * s, a = Math.random() * 6.3, l = 3 + Math.random() * 10;
    g.strokeStyle = Math.random() < .5 ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.25)';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  addNoise(g, s, s, 20);
  return c;
}

/* --- decals (colour + bump drawn by the same function) */
function decal(W, H, draw) {
  const cm = mkCanvas(W, H), cb = mkCanvas(W, H);
  const gm = cm.getContext('2d'), gb = cb.getContext('2d');
  draw(gm, 'color', W, H);
  draw(gb, 'bump', W, H);
  gb.globalCompositeOperation = 'destination-over'; gb.fillStyle = '#000'; gb.fillRect(0, 0, W, H);
  return { map: tex(cm, { clampEdge: true }), bump: tex(cb, { color: false, clampEdge: true }) };
}
function hatch(g, W, H, ang, sp, c1, c2, lw) {
  g.save(); g.globalCompositeOperation = 'source-atop';
  g.translate(W / 2, H / 2); g.rotate(ang);
  const D = Math.hypot(W, H);
  g.lineWidth = lw;
  for (let x = -D; x < D; x += sp) {
    g.strokeStyle = c1; g.beginPath(); g.moveTo(x, -D); g.lineTo(x, D); g.stroke();
    g.strokeStyle = c2; g.beginPath(); g.moveTo(x + sp / 2, -D); g.lineTo(x + sp / 2, D); g.stroke();
  }
  g.restore();
}
function rrPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function crossPath(g, cx, cy, s, arm, rad) {
  const a = arm / 2, h = s / 2;
  const P = [[-a, -h], [a, -h], [a, -a], [h, -a], [h, a], [a, a], [a, h], [-a, h], [-a, a], [-h, a], [-h, -a], [-a, -a]];
  g.beginPath(); g.moveTo(cx, cy - h);
  for (let k = 1; k <= 12; k++) {
    const p = P[k % 12], q = P[(k + 1) % 12];
    g.arcTo(cx + p[0], cy + p[1], cx + (p[0] + q[0]) / 2, cy + (p[1] + q[1]) / 2, rad);
  }
  g.closePath();
}
function decalMat(d, o = {}) {
  return new THREE.MeshStandardMaterial({
    map: d.map, bumpMap: d.bump, bumpScale: o.bumpScale ?? 2.5, roughness: o.roughness ?? .78,
    metalness: 0, alphaTest: .5, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, ...o.extra
  });
}

/* ------------------------------------------------------------------ materials */
const weave = weaveCanvas(512, 32, 0);
const ripstop = weaveCanvas(512, 32, 5);
const webC = webbingCanvas();
function fabric(color, cnv, rep, o = {}) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: o.rough ?? .86,
    map: tex(lighten(cnv, o.vary ?? .22), { repeat: [rep, rep] }),
    bumpMap: tex(cnv, { repeat: [rep, rep], color: false }), bumpScale: o.bump ?? 1.4,
    sheen: o.sheen ?? .7, sheenRoughness: .55, sheenColor: new THREE.Color(o.sheenColor ?? 0xffffff),
    side: o.side ?? THREE.FrontSide
  });
}
function webbing(color, o = {}) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: o.rough ?? .78, map: tex(lighten(webC, o.vary ?? .3)), bumpMap: tex(webC, { color: false }),
    bumpScale: 2, sheen: .5, sheenRoughness: .5, sheenColor: new THREE.Color(o.sheenColor ?? 0xffffff), side: THREE.DoubleSide
  });
}
const M = {
  whiteFab: fabric(0xf2f1ed, weave, 2.6, { sheenColor: 0xffffff, vary: .2 }),
  redFab: fabric(0xa8131b, ripstop, 2.4, { sheenColor: 0xff8080, vary: .3 }),
  blackFab: fabric(0x202124, weave, 2.6, { sheenColor: 0x8a8a8a, vary: .35 }),
  baseFab: fabric(0x18191b, weave, 4, { sheenColor: 0x666666, vary: .4, rough: .93, bump: 2.2 }),
  airmesh: new THREE.MeshPhysicalMaterial({ color: 0x3a3c40, roughness: .9, map: tex(lighten(airmeshCanvas(), .55), { repeat: [3, 3] }),
    bumpMap: tex(airmeshCanvas(), { repeat: [3, 3], color: false }), bumpScale: 4, sheen: .6, sheenColor: new THREE.Color(0x999999) }),
  pipingRed: webbing(0xb0161e, { sheenColor: 0xff9090 }),
  webRed: webbing(0xb3141c, { sheenColor: 0xff9090 }),
  webBlack: webbing(0x1c1d20, { sheenColor: 0x888888 }),
  tapeRed: webbing(0x9d1219, { sheenColor: 0xff8080 }),
  tapeBlack: webbing(0x17181a, { sheenColor: 0x777777 }),
  teethRed: new THREE.MeshPhysicalMaterial({ color: 0xc41c24, roughness: .32, clearcoat: .4 }),
  teethBlack: new THREE.MeshPhysicalMaterial({ color: 0x141416, roughness: .35, clearcoat: .4 }),
  plastic: new THREE.MeshPhysicalMaterial({ color: 0x141416, roughness: .48, clearcoat: .25 }),
  metalSilver: new THREE.MeshStandardMaterial({ color: 0xc8ccd2, metalness: 1, roughness: .24 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x2c2d31, metalness: .85, roughness: .34 }),
  threadWhite: new THREE.MeshStandardMaterial({ color: 0xeeeeea, roughness: .65 }),
  threadRed: new THREE.MeshStandardMaterial({ color: 0x7e0c12, roughness: .65 }),
  threadBlack: new THREE.MeshStandardMaterial({ color: 0x0d0d0e, roughness: .6 }),
  cordRed: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .7, map: tex(braidCanvas('#b51820', '#f2f2f2')) }),
  cordBlack: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .7, map: tex(braidCanvas('#1d1d20', '#c4161d')) }),
  reflective: new THREE.MeshStandardMaterial({ color: 0xd7dade, metalness: .7, roughness: .3, bumpMap: tex(prismCanvas(), { repeat: [30, 30], color: false }),
    bumpScale: 1.2, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }),
  clearPVC: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .06, metalness: 0, transparent: true, opacity: .16, clearcoat: 1,
    clearcoatRoughness: .05, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6 }),
};
const paperC = paperCanvas();
M.paper = new THREE.MeshPhysicalMaterial({ color: 0xf7f6f2, roughness: .62, bumpMap: tex(paperC, { repeat: [3, 3], color: false }), bumpScale: .8 });

/* ------------------------------------------------------------------ soft "pillow" box surface */
class SoftBox {

      g.fillStyle = '#fbfbf9'; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(160,165,175,.6)'; for (const x0 of [0, W - 90]) for (let x = x0; x < x0 + 90; x += 12) g.fillRect(x, 0, 5, H);
      g.fillStyle = '#c4161e'; g.fillRect(90, 24, W - 180, 14); g.fillRect(90, H - 38, W - 180, 14);
      g.fillStyle = '#132b55'; g.font = '800 62px Arial'; g.textBaseline = 'middle'; g.fillText('ADHESIVE BANDAGE', 130, 130);
      g.fillStyle = '#444'; g.font = '500 36px Arial'; g.fillText('STERILE  ·  72 × 19 mm  ·  latex free', 130, 205);
      g.fillStyle = '#c4161e'; g.font = '800 34px Arial'; g.fillText('◀ PULL', 130, 270); g.fillText('PULL ▶', W - 260, 270);
    });
    wr.add(mesh(conformPlane(surf, V(0, .024, 0), V(1, 0, 0), V(0, 0, -1), .858, .298, .001, 40), decalMat(d, { bumpScale: 1, roughness: .5 })));
    wr.position.set(1.25, 0, 1.55); wr.rotation.y = -.5;
    G.add(wr);
  }
  return G;
}

/* ================================================================== LARGE MEDKIT BACKPACK */
function buildBackpack() {
  const G = new THREE.Group();
  const hw = 1.5, hh = 2.2, hd = .95, r = .35, cy = 2.2;
  const body = new SoftBox({ w: 2 * hw, h: 2 * hh, d: 2 * hd, r, center: V(0, cy, 0), bx: .11, bt: .1, bb: 0, bz: .15, bzBack: .12, pw: 2, wrinkle: .013, wrinkleFreq: 1.5, seed: 11 });
  G.add(mesh(body.geometry(.042), M.redFab));
  const base = new SoftBox({ w: 3.07, h: .72, d: 1.97, r: .24, center: V(0, .36, 0), bx: .012, bz: .012, pw: 2, wrinkle: .004, seed: 5 });
  G.add(mesh(base.geometry(.04), M.baseFab));
  const stB = new Stitches(M.threadBlack), stW = new Stitches(M.threadWhite, [.022, .006, .008]);
  // base top stitching
  {
    const pts = rrSample(1.535, .985, .24, 0, rrLen(1.535, .985, .24), .02, true).map(([u, v]) => V(u, .64, v));
    stB.add(surfFrames(base, pts, true), { lift: .003, pitch: .036 });
  }
  // piping on front/back body seams
  const k = r * Math.SQRT1_2;
  for (const sz of [1, -1]) {
    const hu = hw - r + k, hv = hh - r + k, z = sz * (hd - r + k);
    const pts = rrSample(hu, hv, k, 0, rrLen(hu, hv, k), .025, true).map(([u, v]) => V(u, cy + v, z)).filter(p => p.y > .55);
    const F = surfFrames(body, pts, false);
    G.add(mesh(sweepGeo(F, { width: .06, thick: .06, offset: -.022, round: 2, vScale: 12 }), M.webBlack));
  }

  // main compartment zipper (sides + top, two sliders meeting on top)
  {
    const z = .4, s0 = rrS.right(hw, hh, r, -1.25), s1 = rrS.left(hw, hh, r, -1.25);
    const pts = rrSample(hw, hh, r, s0, s1, .012).map(([u, v]) => V(u, cy + v, z));
    const F = surfFrames(body, pts, false);
    const top = (rrS.top(hw, hh, r, 0) - s0) / (s1 - s0) * F.len;
    G.add(makeZipper(F, { tapeMat: M.tapeBlack, teethMat: M.teethBlack, metal: M.metalDark, cordMat: M.cordBlack,
      sliders: [{ s: top - .22, angle: Math.PI }, { s: top + .22, flip: true, angle: Math.PI }] }));
    stB.add(F, { across: .088, pitch: .03 }); stB.add(F, { across: -.088, pitch: .03 });
  }

  // front pocket
  const pc = V(0, 1.68, hd + .16);
  const pocket = new SoftBox({ w: 2.4, h: 2.5, d: .62, r: .24, center: pc, bx: .03, bt: .04, bz: .14, bzBack: 0, pw: 2, wrinkle: .009, wrinkleFreq: 1.9, seed: 21 });
  G.add(mesh(pocket.geometry(.035), M.redFab));
  {
    const pk = .24 * Math.SQRT1_2, hu = 1.2 - .24 + pk, hv = 1.25 - .24 + pk;
    const pts = rrSample(hu, hv, pk, 0, rrLen(hu, hv, pk), .02, true).map(([u, v]) => V(u, pc.y + v, pc.z + (.31 - .24 + pk)));
    G.add(mesh(sweepGeo(surfFrames(pocket, pts, true), { width: .055, thick: .055, offset: -.02, round: 2, vScale: 12 }), M.webBlack));
    const z = pc.z + .03, s0 = rrS.right(1.2, 1.25, .24, -.85), s1 = rrS.left(1.2, 1.25, .24, -.85);
    const zp = rrSample(1.2, 1.25, .24, s0, s1, .012).map(([u, v]) => V(u, pc.y + v, z));
    const F = surfFrames(pocket, zp, false);
    const at = (rrS.top(1.2, 1.25, .24, .55) - s0) / (s1 - s0) * F.len;
    G.add(makeZipper(F, { tapeMat: M.tapeBlack, teethMat: M.teethBlack, metal: M.metalDark, cordMat: M.cordBlack, sliders: [{ s: at, angle: 0 }] }));
    stB.add(F, { across: .088, pitch: .03 }); stB.add(F, { across: -.088, pitch: .03 });
  }
  // patch: white square, red cross, merrowed border
  {
    const d = decal(1024, 1024, (g, mode, W) => {
      rrPath(g, 8, 8, W - 16, W - 16, 110);
      g.fillStyle = mode === 'color' ? '#2b2b2e' : '#cfcfcf'; g.fill();
      hatch(g, W, W, 0, 6, mode === 'color' ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.5)', 'rgba(0,0,0,.35)', 2.5);
      rrPath(g, 52, 52, W - 104, W - 104, 76);
      g.fillStyle = mode === 'color' ? '#f3f2ee' : '#7a7a7a'; g.fill();
      if (mode === 'color') { g.save(); g.clip(); g.strokeStyle = 'rgba(0,0,0,.05)'; for (let x = 0; x < W; x += 5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, W); g.stroke(); } g.restore(); }
      crossPath(g, W / 2, W / 2, W * .66, W * .23, 16);
      g.fillStyle = mode === 'color' ? '#c4161e' : '#b4b4b4'; g.fill();
      g.save(); crossPath(g, W / 2, W / 2, W * .66, W * .23, 16); g.clip();
      hatch(g, W, W, .7, 7, mode === 'color' ? 'rgba(255,120,120,.25)' : 'rgba(255,255,255,.6)', mode === 'color' ? 'rgba(60,0,0,.25)' : 'rgba(0,0,0,.35)', 3);
      g.restore();
    });
    G.add(mesh(conformPlane(pocket, V(0, pc.y + .12, pc.z + .31), V(1, 0, 0), V(0, 1, 0), 1.0, 1.0, .007), decalMat(d)));
    // velcro field outline stitching around patch
    const pts = rrSample(.56, .56, .08, 0, rrLen(.56, .56, .08), .02, true).map(([u, v]) => V(u, pc.y + .12 + v, pc.z + .31));
    stB.add(surfFrames(pocket, pts, true), { lift: .004, pitch: .034 });
  }
  // reflective band across the upper front
  {
    G.add(new THREE.Mesh(conformPlane(body, V(0, 3.4, hd), V(1, 0, 0), V(0, 1, 0), 2.62, .24, .006, 60), M.reflective));
    for (const dy of [.105, -.105]) stB.add(surfFrames(body, lerpPts(V(-1.3, 3.4 + dy, hd), V(1.3, 3.4 + dy, hd), 60), false, .008), { pitch: .032 });
  }

  // top grab handle with padded grip
  {
    const hz = -.25, pts = [];
    for (let i = 0; i <= 140; i++) {
      const x = -.66 + 1.32 * i / 140, ax = Math.abs(x);
      const f = body.frame(V(x, cy + hh, hz));
      const arch = ax < .44 ? .26 * Math.pow(Math.cos(ax / .44 * Math.PI / 2), .55) : 0;
      pts.push(f.pos.addScaledVector(f.normal, .013 + arch));
    }
    const F = freeFrames(pts, V(0, 0, 1), V(0, 1, 0));
    const bump = u => smooth(.27, .36, u) * (1 - smooth(.64, .73, u));
    G.add(mesh(sweepGeo(F, { width: .27, thick: .024, offset: -.012, round: 10 }), M.webBlack));
    G.add(mesh(sweepGeo(F, { widthFn: u => .2 + .14 * bump(u), thickFn: u => .02 + .07 * bump(u), offset: -.01, round: 3, width: .3 }), M.blackFab));
    for (const sx of [1, -1]) {
      const x0 = sx * .47, x1 = sx * .65;
      boxX(body, stW, [V(x0, 5, hz - .11), V(x1, 5, hz - .11), V(x1, 5, hz + .11), V(x0, 5, hz + .11)], .028);
    }
  }

  // sides: MOLLE rows + compression straps with side-release buckles
  for (const sx of [1, -1]) {
    for (const y of [1.78, 2.2, 2.62]) {
      const F = surfFrames(body, lerpPts(V(sx * hw, y, -.72), V(sx * hw, y, .24), 60), false, .01);
      G.add(mesh(sweepGeo(F, { width: .23, thick: .018, offset: -.009, round: 10 }), M.webBlack));
      for (const z of [-.69, -.37, -.05, .21]) {
        const col = surfFrames(body, lerpPts(V(sx * hw, y - .1, z), V(sx * hw, y + .1, z), 10), false, .02);
        stB.add(col, { pitch: .018, across: -.012 }); stB.add(col, { pitch: .018, across: .012 });
      }
    }
    for (const y of [3.15, 1.25]) {
      const lift = p => .012 + .03 * smooth(-.7, -.2, p.z) * (1 - smooth(.55, .8, p.z));
      const F = surfFrames(body, lerpPts(V(sx * hw, y, -.82), V(sx * hw, y, .82), 80), false, lift);
      G.add(mesh(sweepGeo(F, { width: .25, thick: .02, offset: -.01, round: 10 }), M.webBlack));
      const f = sampleFrames(F, F.len * .45);
      const b = makeBuckle(M.plastic);
      G.add(place(b, f.pos.clone().addScaledVector(f.normal, .03), f.tangent, f.normal));
      for (const s of [.04, F.len - .1]) { const a = sampleFrames(F, s); stB.add(surfFrames(body, lerpPts(a.pos.clone().addScaledVector(a.binormal, -.1), a.pos.clone().addScaledVector(a.binormal, .1), 10), false, .022), { pitch: .016 }); }
    }
  }

  // back: airmesh pads
  for (const sx of [1, -1]) for (const y of [3.22, 1.78]) {
    const pad = new SoftBox({ w: 1.05, h: 1.28, d: .22, r: .1, center: V(sx * .6, y, -1.07), bzBack: .07, bz: 0, bx: .01, bt: .01, pw: 2, wrinkle: .006, seed: sx * 7 + y });
    G.add(mesh(pad.geometry(.03), M.airmesh));
    const pts = rrSample(.47, .58, .07, 0, rrLen(.47, .58, .07), .02, true).map(([u, v]) => V(sx * .6 - u, y + v, -1.4));
    stB.add(surfFrames(pad, pts, true), { lift: .003, pitch: .034 });
  }

  // padded shoulder straps + adjustment webbing + ladder locks
  const strapAt = [];
  for (const sx of [1, -1]) {
    const ctrl = [V(.42, 4.3, -.68), V(.45, 4.06, -1.12), V(.5, 3.62, -1.47), V(.58, 2.95, -1.55), V(.68, 2.15, -1.53), V(.78, 1.5, -1.45), V(.86, 1.12, -1.38)]
      .map(p => V(p.x * sx, p.y, p.z));
    const pts = curve(ctrl, 160);
    const F = freeFrames(pts, V(1, 0, 0), V(0, 0, -1));
    const Wf = u => .44 + .2 * Math.sin(Math.PI * Math.min(1, u * 1.15)), Tf = u => .05 + .08 * smooth(0, .18, u) * (1 - .4 * smooth(.85, 1, u));
    G.add(mesh(sweepGeo(F, { widthFn: Wf, thickFn: Tf, width: .5, round: 4, P: 28, vScale: 2.5 }), M.airmesh));
    // outer nylon shell
    G.add(mesh(sweepGeo(F, { widthFn: u => Wf(u) * .9, thickFn: u => Tf(u) + .012, width: .5, round: 4, P: 28, offset: .003, vScale: 4 }), M.blackFab));
    stB.add(F, { across: u => Wf(u) * .42, lift: u => Tf(u) * 1.0 + .01, pitch: .034 });
    stB.add(F, { across: u => -Wf(u) * .42, lift: u => Tf(u) * 1.0 + .01, pitch: .034 });
    strapAt.push(F);
    // webbing down to the base, through a ladder lock, with a hanging tail
    const wctrl = [V(.8, 1.3, -1.43), V(.95, .86, -1.33), V(1.1, .56, -1.2), V(1.2, .38, -1.06), V(1.26, .3, -.96)].map(p => V(p.x * sx, p.y, p.z));
    const WF = freeFrames(curve(wctrl, 60), V(1, -.3, 0).multiply(V(sx, 1, 1)), V(0, 0, -1));
    G.add(mesh(sweepGeo(WF, { width: .25, thick: .02, round: 10 }), M.webBlack));
    const lf = sampleFrames(WF, WF.len * .55);
    G.add(place(makeLadder(M.plastic), lf.pos.clone().addScaledVector(lf.normal, .02), lf.binormal, lf.normal));
    const tctrl = [lf.pos.clone().addScaledVector(lf.normal, .05), V(1.06 * sx, .34, -1.3), V(1.03 * sx, .12, -1.33), V(1.02 * sx, .04, -1.3)];
    const TF = freeFrames(curve(tctrl, 30), V(1, 0, 0), V(0, 0, -1));
    G.add(mesh(sweepGeo(TF, { width: .25, thick: .018, round: 10 }), M.webBlack));
  }
  // sternum strap
  {
    const y = 2.95, pts = [];
    for (let i = 0; i <= 60; i++) { const x = -.72 + 1.44 * i / 60; pts.push(V(x, y - .02 * (1 - Math.pow(x / .72, 2)), -1.69 - .015 * (1 - Math.pow(x / .72, 2)))); }
    const F = freeFrames(pts, V(0, 1, 0), V(0, 0, -1));
    G.add(mesh(sweepGeo(F, { width: .2, thick: .018, round: 10 }), M.webBlack));
    const f = sampleFrames(F, F.len / 2);
    const b = makeBuckle(M.plastic); b.scale.setScalar(.8);
    G.add(place(b, f.pos.clone().addScaledVector(f.normal, .03), f.tangent, f.normal));
  }
  // hang loop
  {
    const pts = [];
    for (let i = 0; i <= 40; i++) { const t = i / 40, x = -.16 + .32 * t; const f = body.frame(V(x, 4.4, -.78)); pts.push(f.pos.addScaledVector(f.normal, .012 + .14 * Math.pow(Math.sin(Math.PI * t), .7))); }
    G.add(mesh(sweepGeo(freeFrames(pts, V(0, 0, 1), V(0, 1, -.4)), { width: .2, thick: .02, round: 10 }), M.webBlack));
  }

  G.add(stB.mesh(), stW.mesh());
  return G;
}

/* ------------------------------------------------------------------ assemble */
const groups = {};
const views = {
  all: { target: V(0, 1.3, 0), cam: V(0, 7.5, 15),
    info: 'Three fully procedural models. Every zipper tooth, stitch, buckle and fibre texture is generated in the browser — no image files.' },
  bag: { target: V(-4.5, .6, .2), cam: V(-2.2, 2.6, 4.1),
    info: 'White first-aid pouch (~26 × 11 × 17 cm): embroidered red cross and “FIRST AID”, two-way red zipper with paracord pulls, red bias-bound piping, webbing handle with box-X stitching, steel D-rings, clear ID window with card on the back.' },
  band: { target: V(.2, .15, .55), cam: V(1.9, 2.7, 4.3),
    info: 'Bandages: open-weave cotton gauze roll (partly unrolled), elastic crepe bandage with toothed butterfly clips, cloth surgical tape on a ribbed plastic core, sterile 10×10 cm gauze pad pouch, and adhesive plasters (two open, one wrapped).' },
  pack: { target: V(5, 2.2, -.2), cam: V(10.6, 5.4, 8.8),
    info: 'Large trauma backpack (~30 × 44 × 19 cm): ripstop shell, ballistic-nylon base, two-way main zipper, front pocket with merrowed cross patch, reflective band, MOLLE rows, compression straps with side-release buckles, airmesh back pads, padded harness with sternum strap and ladder-lock adjusters.' },
};

function build() {
  groups.bag = buildWhiteBag(); groups.bag.position.set(-4.5, 0, .2); groups.bag.rotation.y = .38;
  groups.band = buildBandages(); groups.band.position.set(0, 0, .2);
  groups.pack = buildBackpack(); groups.pack.position.set(5, 0, -.2); groups.pack.rotation.y = -.32;
  for (const g of Object.values(groups)) { scene.add(g); g.traverse(o => { if (o.material && o.material.envMapIntensity !== undefined) o.material.envMapIntensity = .55; }); }
  document.getElementById('load').remove();
}

let fly = null;
function go(v) {
  document.querySelectorAll('#btns button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('info').textContent = views[v].info;
  fly = { t: 0, fromC: camera.position.clone(), fromT: controls.target.clone(), toC: views[v].cam.clone(), toT: views[v].target.clone() };
}
document.querySelectorAll('#btns button[data-v]').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
const spin = document.getElementById('spin');
spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.classList.toggle('on', controls.autoRotate); });
controls.addEventListener('start', () => { fly = null; });
document.getElementById('info').textContent = views.all.info;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.3);
    const e = fly.t < .5 ? 4 * fly.t ** 3 : 1 - Math.pow(-2 * fly.t + 2, 3) / 2;
    camera.position.lerpVectors(fly.fromC, fly.toC, e);
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(t => { renderer.render(scene, camera); setTimeout(() => { build(); const v = new URLSearchParams(location.search).get('view'); if (v && views[v]) { go(v); fly.t = .999; } window.__ready = true; requestAnimationFrame(tick); }, 30); });
</script>
